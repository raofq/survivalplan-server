# Render Blueprint（免费层部署配置）
# 推送后到 dashboard.render.com 选 Blueprint 部署即可
services:
  - type: web
    name: survivalplan-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
